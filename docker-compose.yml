version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/sibsiu
      USE_PRISMA: "false"
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      UPSTASH_REDIS_REST_URL: "http://redis:8001"
      UPSTASH_REDIS_REST_TOKEN: "dev-token"
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOKI_JOB_NAME: sibsiu-app
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sibsiu
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.0
    volumes:
      - /var/log:/var/log
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
